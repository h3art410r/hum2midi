<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>试听实验室 · Make Anything Musical</title>
  <style>
    :root { color-scheme:light; --ink:#17211f; --muted:#68716d; --green:#caff4d; --paper:#f6f4ef; --line:#dcded7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#dfe3dc; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .stage { width:min(100%,960px); min-height:100vh; margin:auto; padding:clamp(24px,5vw,64px); background:var(--paper); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-size:14px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; }
    a { color:inherit; }
    .back { border:1px solid var(--line); border-radius:999px; padding:9px 14px; text-decoration:none; font-size:13px; }
    main { max-width:720px; margin:12vh auto 0; }
    .eyebrow { color:#4d6d00; font-size:12px; font-weight:750; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:14px 0 12px; font-size:clamp(38px,8vw,72px); line-height:.98; letter-spacing:-.065em; }
    .intro { color:var(--muted); line-height:1.7; }
    .panel { margin-top:28px; padding:20px; border:1px solid var(--line); border-radius:18px; background:#fffefa; }
    .panel h2 { margin:0 0 8px; font-size:18px; }
    .meta { margin:0 0 18px; color:var(--muted); font-size:13px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; }
    button { border:1px solid var(--ink); border-radius:999px; padding:12px 18px; background:var(--ink); color:#fff; font:inherit; cursor:pointer; }
    button.secondary { border-color:var(--line); background:transparent; color:var(--ink); }
    button:disabled { opacity:.5; cursor:wait; }
    #status { min-height:24px; margin:18px 0 10px; color:#4d6d00; font-size:14px; }
    audio { width:100%; margin-top:10px; }
    .log { margin-top:20px; max-height:230px; overflow:auto; padding:12px; border-radius:12px; background:#202522; color:var(--green); white-space:pre-wrap; font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .note { margin-top:22px; color:var(--muted); font-size:12px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="stage">
    <header><div class="brand">Make Anything Musical</div><a class="back" href="./">返回录音主页</a></header>
    <main>
      <div class="eyebrow">Listening Lab</div>
      <h1>先听，再调。</h1>
      <p class="intro">这里固定使用最近一次真实录音作为输入。你可以反复试听已有结果，或点击生成新版，不需要重新哼唱和上传。</p>
      <section class="panel">
        <h2>固定试听输入</h2>
        <p id="meta" class="meta">正在读取最近录音…</p>
        <div class="actions">
          <button id="generate">根据当前模型生成新版 Funk</button>
          <button id="refresh" class="secondary">刷新状态</button>
        </div>
        <div id="status" role="status" aria-live="polite">准备中…</div>
        <div id="audio-wrap" class="hidden"><strong>试听结果</strong><audio id="player" controls preload="metadata"></audio></div>
      </section>
      <p class="note">生成仍会经过 CUDA Worker，但不再重复录音。每次生成会保留同一输入，方便比较“效果好但慢”的旧路径和当前路径。</p>
      <pre id="log" class="log">试听日志已启动。
</pre>
    </main>
  </div>
  <script>
    const APP_BASE = /^\/hum2midi(?:\/|$)/.test(window.location.pathname) ? '/hum2midi' : '';
    const apiUrl = path => `${APP_BASE}${path}`;
    const meta = document.querySelector('#meta');
    const status = document.querySelector('#status');
    const generate = document.querySelector('#generate');
    const refresh = document.querySelector('#refresh');
    const wrap = document.querySelector('#audio-wrap');
    const player = document.querySelector('#player');
    const logBox = document.querySelector('#log');
    const log = (...parts) => { logBox.textContent += `[${new Date().toLocaleTimeString()}] ${parts.join(' ')}\n`; logBox.scrollTop = logBox.scrollHeight; };
    async function request(path, options) {
      log('REQ', options?.method || 'GET', path);
      const response = await fetch(apiUrl(path), options);
      log('RESP', response.status, path);
      return response;
    }
    async function refreshState() {
      try {
        const response = await request('/api/listen/sample');
        const data = await response.json();
        if (!data.source_available) {
          meta.textContent = '还没有可复用的真实录音，请先回主页录制一次。';
          generate.disabled = true;
          status.textContent = '等待第一次真实录音。';
          return;
        }
        meta.textContent = `输入：${data.source_name}；模型输入固定复用最近一次真实录音。`;
        generate.disabled = false;
        if (data.cached_available && data.cached_url) {
          player.src = apiUrl(data.cached_url);
          wrap.classList.remove('hidden');
          status.textContent = '已有缓存结果，可以直接试听。';
          log('CACHE_READY', data.cached_url);
        } else {
          status.textContent = '还没有缓存结果，点击生成新版。';
        }
      } catch (error) {
        status.textContent = `读取失败：${error.message}`;
        log('ERROR', error.message);
      }
    }
    async function poll(id) {
      for (let i = 0; i < 450; i++) {
        await new Promise(resolve => setTimeout(resolve, 1800));
        const response = await request(`/api/generations/${id}`);
        const job = await response.json();
        status.textContent = job.message || job.status;
        log('STATE', job.status, job.message || '');
        if (job.status === 'failed') throw new Error(job.error || '生成失败');
        if (job.status === 'completed') {
          const item = Object.values(job.variants || {}).find(value => value.status === 'completed');
          if (!item) throw new Error('没有可试听的输出');
          player.src = apiUrl(item.audio_url);
          wrap.classList.remove('hidden');
          status.textContent = '生成完成，可以试听。';
          generate.disabled = false;
          return;
        }
      }
      throw new Error('等待超过 15 分钟');
    }
    generate.addEventListener('click', async () => {
      generate.disabled = true;
      status.textContent = '正在提交固定试听输入…';
      try {
        const response = await request('/api/listen/generate', {method:'POST'});
        const created = await response.json();
        if (!response.ok) throw new Error(created.detail || '提交失败');
        log('JOB', created.id);
        await poll(created.id);
      } catch (error) {
        status.textContent = `生成失败：${error.message}`;
        log('ERROR', error.message);
        generate.disabled = false;
      }
    });
    refresh.addEventListener('click', refreshState);
    refreshState();
  </script>
</body>
</html>
