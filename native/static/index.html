<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hum to Music · Native Prosody</title>
  <style>
    :root { color-scheme: light; --ink:#17211f; --muted:#68716d; --green:#caff4d; --paper:#f6f4ef; --line:#dcded7; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#dfe3dc; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .stage { width:min(100%,1200px); min-height:100vh; margin:auto; padding:clamp(20px,4vw,60px); background:var(--paper); }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .brand { font-size:14px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .badge { border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:12px; color:var(--muted); }
    main { max-width:980px; margin:10vh auto 0; }
    .eyebrow { color:#4d6d00; font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:12px 0; max-width:760px; font-size:clamp(42px,7vw,84px); line-height:.95; letter-spacing:-.07em; }
    .intro { max-width:660px; color:var(--muted); line-height:1.7; font-size:clamp(15px,2vw,19px); }
    .panel { margin-top:34px; padding:clamp(18px,3vw,32px); border:1px solid var(--line); border-radius:22px; background:#fffefa; }
    .row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
    input[type=file] { max-width:100%; }
    button { border:1px solid var(--ink); border-radius:999px; padding:12px 20px; background:var(--ink); color:white; font:inherit; cursor:pointer; }
    button.secondary { border-color:var(--line); background:transparent; color:var(--ink); }
    button:disabled { opacity:.5; cursor:wait; }
    #status { min-height:24px; margin:18px 0 10px; color:#4d6d00; }
    .progress { height:8px; border-radius:999px; background:#edf0e8; overflow:hidden; }
    .progress > i { display:block; width:0; height:100%; background:var(--green); transition:width .3s ease; }
    .results { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:20px; }
    .card { padding:18px; border:1px solid var(--line); border-radius:16px; background:#fff; }
    .card h2 { margin:0 0 8px; font-size:19px; }
    .card p { color:var(--muted); line-height:1.5; font-size:13px; }
    audio { width:100%; margin-top:10px; }
    .log { margin-top:22px; max-height:250px; overflow:auto; padding:14px; border-radius:14px; background:#202522; color:var(--green); white-space:pre-wrap; font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .hidden { display:none; }
    @media (max-width:760px) { .results { grid-template-columns:1fr; } main { margin-top:7vh; } }
    @media (min-width:1000px) { body.debug-16x9 .stage { min-height:675px; aspect-ratio:16/9; } }
  </style>
</head>
<body>
  <div class="stage">
    <header><div class="brand">Make Anything Musical</div><div class="badge">Native Prosody Demo</div></header>
    <main>
      <div class="eyebrow">Hum to Music</div>
      <h1>保留你的旋律，重新编曲。</h1>
      <p class="intro">上传一段真实哼唱。官方 Prosody 条件会保留音高和时间，模型分别生成 Funk 与 Lo-fi；哪一个先完成，哪一个先试听。</p>
      <section class="panel">
        <div class="row">
          <input id="audio" type="file" accept=".m4a,.mp4,.wav,.mp3,.webm,.ogg,audio/*">
          <button id="submit">生成两个版本</button>
          <button id="health" class="secondary">检查 Worker</button>
        </div>
        <div id="status" role="status" aria-live="polite">请选择 5–15 秒的哼唱文件。</div>
        <div class="progress"><i id="bar"></i></div>
        <div id="results" class="results"></div>
        <pre id="log" class="log">Native 前端日志已启动。
</pre>
      </section>
    </main>
  </div>
  <script>
    const audio = document.querySelector('#audio');
    const submit = document.querySelector('#submit');
    const health = document.querySelector('#health');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    const bar = document.querySelector('#bar');
    const logBox = document.querySelector('#log');
    const log = (...parts) => { logBox.textContent += `[${new Date().toLocaleTimeString()}] ${parts.join(' ')}\n`; logBox.scrollTop = logBox.scrollHeight; };
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const base = /^\/hum2midi(?:\/|$)/.test(location.pathname) ? '/hum2midi' : '';
    const api = path => `${base}${path}`;
    let lastCursor = 0;
    let currentJob = null;
    async function request(path, options = {}) {
      log('REQ', options.method || 'GET', path);
      const response = await fetch(api(path), options);
      const copy = response.clone();
      const raw = await copy.text();
      log('RESP', response.status, raw.slice(0, 260));
      return response;
    }
    async function pollLogs() {
      try {
        const response = await fetch(api(`/api/debug/logs?since=${lastCursor}`), {cache:'no-store'});
        const data = await response.json(); lastCursor = Number(data.cursor || lastCursor);
        (data.logs || []).forEach(item => log('BACKEND', item.level || 'INFO', item.message || ''));
      } catch (error) { log('LOG_ERROR', error.message); }
    }
    setInterval(pollLogs, 1000); pollLogs();
    function renderVariant(id, item) {
      const existing = document.querySelector(`[data-variant="${id}"]`);
      const html = `<article class="card" data-variant="${id}"><h2>${escapeHtml(item.name || id)}</h2><p>${escapeHtml(item.translation || '')}</p>${item.status === 'completed' ? `<audio controls preload="metadata" src="${api(item.audio_url)}"></audio><p>已完成，可试听。耗时 ${escapeHtml(item.elapsed_seconds || '')} 秒</p>` : item.status === 'failed' ? `<p>生成失败：${escapeHtml(item.error || '')}</p>` : `<p>状态：${escapeHtml(item.status || '')}</p>`}</article>`;
      if (existing) existing.outerHTML = html; else results.insertAdjacentHTML('beforeend', html);
    }
    async function pollJob(id) {
      for (let i=0; i<900; i++) {
        const response = await request(`/api/generations/${id}`); const job = await response.json(); currentJob = job;
        const variants = Object.values(job.variants || {});
        variants.forEach(item => renderVariant(item.id, item));
        const done = variants.filter(item => ['completed','failed'].includes(item.status)).length;
        bar.style.width = `${Math.round(done / 2 * 100)}%`;
        status.textContent = job.message || job.status;
        if (job.status === 'completed' || job.status === 'partial' || job.status === 'failed') return;
        await new Promise(resolve => setTimeout(resolve, 1500));
      }
      throw new Error('等待超过 15 分钟');
    }
    submit.addEventListener('click', async () => {
      const file = audio.files?.[0];
      if (!file) { status.textContent = '请先选择音频文件。'; return; }
      submit.disabled = true; results.innerHTML = ''; bar.style.width = '0%'; status.textContent = '正在提交真实哼唱…';
      try {
        const response = await request('/api/generations', {method:'POST', headers:{'Content-Type':file.type || 'audio/wav','X-Audio-Filename':file.name}, body:file});
        const created = await response.json(); if (!response.ok) throw new Error(created.detail || `HTTP ${response.status}`);
        log('JOB', created.id); await pollJob(created.id);
      } catch (error) { status.textContent = `生成失败：${error.message}`; log('ERROR', error.message); }
      finally { submit.disabled = false; }
    });
    health.addEventListener('click', async () => { try { const response = await request('/api/health'); const data = await response.json(); status.textContent = `Worker：${data.worker?.status || 'unknown'}`; } catch (error) { status.textContent = `健康检查失败：${error.message}`; } });
    if (new URLSearchParams(location.search).get('debug') === '16x9') document.body.classList.add('debug-16x9');
  </script>
</body>
</html>
