<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>试听对照 · Hum to Music</title>
  <style>
    :root { color-scheme:light; --ink:#17211f; --muted:#68716d; --green:#caff4d; --paper:#f6f4ef; --line:#dcded7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#dfe3dc; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .stage { width:min(100%,1120px); min-height:100vh; margin:auto; padding:clamp(20px,4vw,54px); background:var(--paper); }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .brand { font-size:14px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    header a { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:12px; }
    main { max-width:1000px; margin:7vh auto 0; }
    .eyebrow { color:#4d6d00; font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:12px 0 10px; max-width:780px; font-size:clamp(38px,6vw,72px); line-height:.98; letter-spacing:-.06em; }
    .intro { max-width:740px; color:var(--muted); line-height:1.7; }
    .panel { margin-top:24px; padding:20px; border:1px solid var(--line); border-radius:20px; background:#fffefa; }
    .panel h2 { margin:0 0 7px; font-size:21px; }
    .panel p { margin:7px 0; color:var(--muted); line-height:1.6; font-size:13px; }
    .meta { color:var(--muted); font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .source { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:20px; align-items:center; background:#202522; color:#f6f4ef; border-color:#202522; }
    .source p, .source .meta { color:#cbd4cc; }
    audio { width:100%; margin-top:10px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:16px; }
    .style-card { min-width:0; padding:20px; border:1px solid var(--line); border-radius:20px; background:#fffefa; }
    .style-card h2 { margin:0; font-size:22px; }
    .style-card > p { color:var(--muted); font-size:13px; line-height:1.6; }
    .variant { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
    .variant-title { display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:750; }
    .tag { color:#4d6d00; font-size:12px; }
    details { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
    summary { cursor:pointer; color:#4d6d00; font-size:13px; font-weight:700; }
    pre { margin:10px 0 0; white-space:pre-wrap; color:var(--ink); font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .foot { margin:18px 0 0; color:var(--muted); font-size:12px; line-height:1.6; }
    .error { color:#a03a2d; }
    @media (max-width:760px) { main { margin-top:6vh; } .grid { grid-template-columns:1fr; } .source { display:block; } }
    @media (min-width:1000px) { body.debug-16x9 .stage { min-height:675px; aspect-ratio:16/9; } }
  </style>
</head>
<body>
  <div class="stage">
    <header><div class="brand">Make Anything Musical</div><a href="./">返回主页</a></header>
    <main>
      <div class="eyebrow">Fixed Listening Check</div>
      <h1>同一段哼唱，四种风格。</h1>
      <p class="intro">四个纯器乐结果都已经提前生成。它们共享同一段真实哼唱输入，进入页面后直接试听，不会再次调用模型。</p>
      <section class="panel source">
        <div>
          <h2>最近一次哼唱</h2>
          <p>四种风格都使用下面这段真实输入，输出时长与输入一致。</p>
          <audio controls preload="metadata" src="static/official/debug_recent_input.wav"></audio>
        </div>
        <div class="meta">输入 10.48 秒<br>seed 42 · CFG 4 · 50 steps<br>固定试听快照</div>
      </section>
      <section id="styles" class="grid" aria-live="polite"></section>
      <p id="loadState" class="foot">正在读取固定试听素材…</p>
      <p class="foot">这页用于比较同一段哼唱在不同器乐风格下的重制效果。</p>
    </main>
  </div>
  <script>
    const base = /^\/hum2midi(?:\/|$)/.test(location.pathname) ? '/hum2midi' : '';
    const api = path => `${base}${path}`;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stylesBox = document.querySelector('#styles');
    const loadState = document.querySelector('#loadState');
    function render(data) {
      stylesBox.innerHTML = (data.styles || []).map(style => {
        const item = style.versions?.instrumental;
        if (!item) return '';
        return `<article class="style-card"><h2>${escapeHtml(style.name)}</h2><p>同一段哼唱的器乐风格化重制。</p><div class="variant"><div class="variant-title"><span>纯器乐</span><span class="tag">${escapeHtml(item.elapsed_seconds)} 秒生成</span></div><audio controls preload="metadata" src="${api('/static/official/' + item.audio)}"></audio><p>${escapeHtml(item.prompt_zh)}</p><details><summary>查看英文 Prompt 和 Negative Prompt</summary><h3>Prompt</h3><pre>${escapeHtml(item.prompt)}</pre><h3>中文参考</h3><pre>${escapeHtml(item.prompt_zh)}</pre><h3>Negative Prompt</h3><pre>${escapeHtml(item.negative_prompt)}</pre><h3>中文参考</h3><pre>${escapeHtml(item.negative_zh)}</pre></details></div></article>`;
      }).join('');
      loadState.textContent = `固定素材已就绪：${data.styles?.length || 0} 种纯器乐风格。`;
    }
    fetch(api('/static/official/debug_snapshot.json'), {cache:'no-store'}).then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); }).then(render).catch(error => { loadState.className='foot error'; loadState.textContent = `固定素材读取失败：${error.message}`; });
    if (new URLSearchParams(location.search).get('debug') === '16x9') document.body.classList.add('debug-16x9');
  </script>
</body>
</html>
